# Cargo settings that must hold for every build of this repo — local, CI, and release alike.
#
# Why this file exists: what a release binary contains must be a function of the source, not of
# whichever machine compiled it. The local speech-to-text engine (stt/) is where that stopped
# being theoretical. v0.3.2 shipped a whisper.cpp build compiled on a GitHub Actions runner that
# happened to have AVX-512; every user whose CPU lacked it — every Intel hybrid chip since Alder
# Lake, every AMD before Zen 4 — got STATUS_ILLEGAL_INSTRUCTION (0xc000001d) the instant
# dictation started. The process died on the spot: no error dialog, no transcript, the window
# simply disappeared (owner report 2026-09-01, Core Ultra 9 290HX).
#
# The engine is now sherpa-onnx, which links a PREBUILT ONNX Runtime from the upstream release
# archives. That removes the CMake/libclang toolchain, and with it the GGML_* knobs that used to
# pin the baseline here — but it also removes our ability to pin it at all: upstream publishes no
# instruction-set statement for those archives, and has had AVX512-FP16 crashes before. So the
# baseline is now something we VERIFY rather than something we set:
#
#   * Never pass `-C target-cpu=native` (or RUSTFLAGS that imply it) anywhere in this repo. It
#     would reintroduce exactly the v0.3.2 failure for our own Rust code.
#   * Every release must run a full dictation once on an AVX-512 machine and once on an
#     AVX2-only machine before publishing. That check belongs on the release checklist; it is
#     the only thing standing between us and a repeat.
#   * If an ISA crash ever recurs, the escape hatch is to build sherpa-onnx from source with
#     fixed flags and point the build at it with SHERPA_ONNX_LIB_DIR.
#
# crt-static below: the Windows sherpa-onnx archive is built /MT (static CRT) while Rust defaults
# to /MD, which links but leaves a LNK4098 CRT-conflict warning. Matching it is both cleaner (no
# warning, no mixed CRT) and one less thing to install on a user's machine — the resulting
# binaries need no Visual C++ runtime at all. Verified on a staticlib+cdylib+rlib shell like
# src-tauri's: cdylib builds and exports normally, and the size cost is about 280 KB.
#
# Registry mirrors, proxies and certificate-revocation settings are deliberately NOT here. They
# are per-machine, and hard-coding one person's mirror breaks everyone else's build.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
