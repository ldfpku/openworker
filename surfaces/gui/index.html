<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- smjworker app icon set (D:\smj-apps\app-icons\openworker): the 16 px SVG is its own
         pixel drawing, not the large icon scaled down. -->
    <link rel="icon" type="image/x-icon" sizes="16x16 24x24 32x32 48x48 64x64" href="/src/brand/app/favicon.ico" />
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="/src/brand/app/favicon.svg" />
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/src/brand/app/favicon-16.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/src/brand/app/apple-touch-icon.png" />
    <title>smjworker</title>
    <!-- Resolve the theme before first paint (no white flash for dark users).
         Must match src/theme.ts: key "openwork-theme", absent/invalid = auto = follow macOS. -->
    <script>
      try {
        var t = localStorage.getItem("openwork-theme");
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
