# 一键发版：版本号自增 → 提交 → 打 tag → 在 tag 上触发 Release 构建。
#
# 日常发版入口（Actions ▸ Bump and tag ▸ Run workflow，档位默认 patch）。它自动完成
# 管理员手册第 6 节里手工做的前几步，并绕开两个坑：
#
#   * release.yml 的闸门：tag 必须等于 tauri.conf.json 的 version。这里先改文件再打
#     tag，两个数字出自同一次计算，不可能漂移。
#   * GITHUB_TOKEN 推的 tag 不会触发别的 workflow（GitHub 防递归）。所以最后一步用
#     `gh workflow run` 在新 tag 的 ref 上显式触发 release.yml——workflow_dispatch 不受
#     防递归限制，而 release job 的条件只看 ref 是不是 tag，dispatch 到 tag 上同样成立。
#
# 产物仍然是 DRAFT Release：构建完去 Releases 页 review，点 Publish 才会把更新真正
# 推给装好的应用。这道人工闸是有意保留的——Publish 即全员升级。
#
# 顺带：GITHUB_TOKEN 推的版本号提交同样不触发 ci.yml。bump 提交只改一个数字，可接受。

name: Bump and tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "升级档位（改 tauri.conf.json 的 version）"
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write # 推版本号提交和 tag
  actions: write # 在新 tag 上触发 Release workflow

# 两个人同时点发版只会打架：后一个的 push 会撞在前一个刚推的 main 上。
concurrency: bump-and-tag

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: 只从 main 发版
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::发版只能在 main 上运行（当前是 ${GITHUB_REF}）——Run workflow 时分支选 main"
          exit 1

      - uses: actions/checkout@v7

      - name: 计算并写入新版本号
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          NEXT=$(python3 - "$BUMP" <<'EOF'
          import json, sys
          from pathlib import Path

          conf = Path("surfaces/gui/src-tauri/tauri.conf.json")
          text = conf.read_text(encoding="utf-8")
          current = json.loads(text)["version"]
          major, minor, patch = (int(x) for x in current.split("."))
          bump = sys.argv[1]
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1
          next_version = f"{major}.{minor}.{patch}"
          # 精确替换那一行，不走 json.dump——它会把整个文件重排。
          needle = f'"version": "{current}"'
          assert text.count(needle) == 1, f"expected exactly one {needle!r}"
          conf.write_text(
              text.replace(needle, f'"version": "{next_version}"'), encoding="utf-8"
          )
          print(next_version)
          EOF
          )
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "将发布 v$NEXT"

      - name: tag 不能已存在
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.ver.outputs.next }}" >/dev/null 2>&1; then
            echo "::error::v${{ steps.ver.outputs.next }} 已经存在——上次发版的提交没进 main？先去 main 看最近的 Prepare app release 提交"
            exit 1
          fi

      - name: 提交、打 tag、推送
        run: |
          NEXT="${{ steps.ver.outputs.next }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surfaces/gui/src-tauri/tauri.conf.json
          git commit -m "Prepare app release ${NEXT}"
          git tag "v${NEXT}"
          # 原子推送：提交和 tag 一起上；main 若在此期间被人推动，整体失败，重跑即可。
          git push --atomic origin main "v${NEXT}"

      - name: 在新 tag 上触发 Release 构建
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "v${{ steps.ver.outputs.next }}"

      - name: 摘要
        run: |
          NEXT="${{ steps.ver.outputs.next }}"
          {
            echo "## v${NEXT} 已进入构建"
            echo ""
            echo "- 构建进度：[Release workflow](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/release.yml)，三平台约 21 分钟"
            echo "- 构建完成后：[Releases](https://github.com/${GITHUB_REPOSITORY}/releases) 里出现**草稿**，review 后点 Publish"
            echo "- Publish 之后，装好的应用才会收到这次自动更新"
          } >> "$GITHUB_STEP_SUMMARY"
